[project]
name = "iac"
version = "0.1.0"
description = "Sistema de gestión de empresas con CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-material>=9.7.5",
    "radon>=6.0.1",
    "tree>=0.2.4",
    "supabase>=2.25.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "streamlit>=1.57.0",
    "pytest>=9.0.3",
    "python-multipart>=0.0.28",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/iac"]
